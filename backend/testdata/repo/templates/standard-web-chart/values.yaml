# Default values for the standard-web-chart template.
# Services referencing this template inherit everything below and override
# only what they need (see the Deep Merge in internal/merge).
replicaCount: 1
port: 8080
image:
  repository: "my-registry/placeholder"
  tag: "latest"
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
