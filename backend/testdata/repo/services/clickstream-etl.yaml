name: clickstream-etl
env: production
template_ref:
  path: "templates/flink-streaming-standard"
values:
  image: "my-registry/flink-jobs/clickstream-etl:1.4.2"
  job:
    jarURI: "local:///opt/flink/usrlib/clickstream-etl.jar"
    entryClass: "com.example.ClickstreamJob"
    parallelism: 4
    args:
      - "--source.topic"
      - "clickstream"
      - "--sink"
      - "iceberg"
  taskManager:
    resource:
      memory: "4096m"
